services:
  postgres:
    image: postgres:17-alpine
    container_name: appuork-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: appuork
      POSTGRES_USER: appuork
      POSTGRES_PASSWORD: appuork
    volumes:
      - appuork_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  appuork_pgdata:
